            <!-- ============================================================ -->
            <!-- BIN SETUP TAB -->
            <!-- ============================================================ -->
            <div class="tab-pane fade" id="tab-bins">
                <div class="row">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">Bin Configuration</div>
                            <div class="card-body">
                                <div class="row g-2 mb-3">
                                    <div class="col">
                                        <label class="form-label">Number of Bins</label>
                                        <input type="number" class="form-control" id="bin-count" value="10" min="1" max="20">
                                    </div>
                                    <div class="col">
                                        <label class="form-label">Bin Spacing (mm)</label>
                                        <input type="number" class="form-control" id="bin-spacing" value="100" min="10">
                                    </div>
                                    <div class="col">
                                        <label class="form-label">Start X (mm)</label>
                                        <input type="number" class="form-control" id="bin-start-x" value="100" min="0">
                                    </div>
                                </div>
                                <div class="row g-2 mt-2 mb-2">
                                    <div class="col">
                                        <label class="form-label">Card Limit / Bin</label>
                                        <input type="number" class="form-control" id="bin-card-limit" value="150" min="1" max="500" title="Max cards per physical bin before it's considered full">
                                    </div>
                                </div>
                                <button class="btn btn-primary" onclick="configureBins()">Apply Even Spacing</button>
                                <button class="btn btn-outline-info ms-2" onclick="saveDefaultBinConfig()" title="Save current bin config so it auto-loads on startup">Save as Default</button>
                                <button class="btn btn-outline-warning ms-2" onclick="apiPost('/api/bins/probe-all')">Probe All Bins</button>
                                <hr class="my-3">
                                <h6>Machine Positions</h6>
                                <div class="row g-2 mb-2">
                                    <div class="col">
                                        <label class="form-label small">Source Bin X</label>
                                        <input type="number" class="form-control form-control-sm" id="machine-source-x" value="50" min="0" step="0.1">
                                    </div>
                                    <div class="col">
                                        <label class="form-label small">Camera Offset</label>
                                        <input type="number" class="form-control form-control-sm" id="machine-detect-x" value="100" min="0" step="0.1">
                                    </div>
                                    <div class="col">
                                        <label class="form-label small">Staging X</label>
                                        <input type="number" class="form-control form-control-sm" id="machine-staging-x" value="162" min="0" step="0.1">
                                    </div>
                                    <div class="col">
                                        <label class="form-label small">Staging W</label>
                                        <input type="number" class="form-control form-control-sm" id="machine-staging-w" value="200" min="10" step="1">
                                    </div>
                                </div>
                                <button class="btn btn-sm btn-outline-primary" onclick="applyMachinePositions()">Apply Machine Positions</button>
                            </div>
                        </div>
                        <!-- Overflow chains -->
                        <div class="card mt-2">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                Overflow Chains
                                <button class="btn btn-sm btn-outline-primary" onclick="addOverflowRow()">+ Add</button>
                            </div>
                            <div class="card-body">
                                <p class="text-muted small mb-2">When a bin fills up, cards overflow to the next bin in the chain. Leave empty for no overflow (sorting pauses when the bin is full).</p>
                                <div id="overflow-chain-rows"></div>
                                <div class="mt-2 d-flex gap-2">
                                    <button class="btn btn-sm btn-success" onclick="saveOverflowConfig()">Save Overflow Config</button>
                                    <button class="btn btn-sm btn-outline-secondary" onclick="clearOverflowConfig()">Clear All</button>
                                </div>
                            </div>
                        </div>
                        <div class="card mt-2">
                            <div class="card-header">Saved Configurations</div>
                            <div class="card-body">
                                <div class="d-flex gap-2 mb-2">
                                    <select class="form-select form-select-sm" id="bin-config-select">
                                        <option value="">-- Select a saved config --</option>
                                    </select>
                                    <button class="btn btn-primary btn-sm" onclick="loadBinConfig()">Load</button>
                                    <button class="btn btn-outline-danger btn-sm" onclick="deleteBinConfig()">Delete</button>
                                </div>
                                <div class="d-flex gap-2">
                                    <input type="text" class="form-control form-control-sm" id="bin-config-name" placeholder="Config name...">
                                    <button class="btn btn-outline-success btn-sm" style="white-space:nowrap;" onclick="saveBinConfig()">Save Current</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card mb-2 position-relative">
                            <div class="card-header">Bin Layout</div>
                            <div class="card-body p-2">
                                <canvas id="bin-layout-canvas" width="800" height="160" class="w-100" style="border:1px solid #333; background:#1a1a2e;"></canvas>
                            </div>
                            <!-- Priority-bin match alerts (non-modal; stacks). -->
                            <div id="priority-toast-stack"
                                 style="position:absolute; top:8px; right:8px;
                                        z-index:1080; max-width:320px;
                                        pointer-events:none;
                                        display:flex; flex-direction:column; gap:8px;">
                            </div>
                        </div>
                        <div class="card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                Bin Positions
                                <button class="btn btn-sm btn-outline-success" onclick="applyManualBinPositions()" title="Save manually edited X positions">Apply Manual Positions</button>
                            </div>
                            <div class="card-body">
                                <table class="table table-sm" id="bin-table">
                                    <thead><tr><th>Bin</th><th>X (mm)</th><th>Probe Z</th><th>Cards</th><th>Status</th><th>Actions</th></tr></thead>
                                    <tbody id="bin-table-body"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
